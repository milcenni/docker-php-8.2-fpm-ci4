# Neoterik (CodeIgniter 4) — nginx + php-fpm
#
#   cp .env.example .env      # adjust APP_PATH / HTTP_PORT
#   docker compose up -d --build
#
# The app is NOT baked into the image: ./html (APP_PATH) is bind-mounted to
# /var/www/html, so put the project files in ./html. On first start the app
# container runs `composer install` if vendor/ is missing and fixes permissions
# on writable/ and uploads/.

name: ${PROJECT_NAME:-neoterik}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: neoterik-php-fpm:8.2
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      COMPOSER_NO_DEV: ${COMPOSER_NO_DEV:-1}
      TZ: ${TZ:-Asia/Kuala_Lumpur}
    volumes:
      - ${APP_PATH:-./html}:/var/www/html
    extra_hosts:
      # lets .env keep `database.default.hostname = host.docker.internal` on Linux too
      - "host.docker.internal:host-gateway"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8085}:80"
    environment:
      TZ: ${TZ:-Asia/Kuala_Lumpur}
    volumes:
      - ${APP_PATH:-./html}:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
